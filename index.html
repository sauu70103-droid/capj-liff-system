<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>錦葳健康美學中心 - 師傅調理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { background-color: #F9F6F0; font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif; }
        .text-earth { color: #5C4A3D; } 
        .bg-earth { background-color: #D2B48C; } 
        .border-soft { border-color: #E8DFD8; }
        .hidden { display: none !important; }
        
        /* V4.8 輸入框視覺優化 */
        input, select, textarea { 
            font-size: 16px !important; 
            border: 1px solid #E8DFD8 !important; 
            border-radius: 6px !important; 
            transition: all 0.3s ease !important; 
            background-color: #FFFFFF;
        }
        input:focus, select:focus, textarea:focus { 
            outline: none !important; 
            border-color: #C09F80 !important; 
            box-shadow: 0 0 0 3px rgba(192, 159, 128, 0.25) !important; 
        }
    </style>
</head>
<body class="text-gray-800 pb-20">

    <header class="bg-earth text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-lg font-bold tracking-wider"><i class="fa-solid fa-leaf mr-2 text-[#F9F6F0]"></i>錦葳健康美學中心</h1>
        <div class="text-sm font-medium bg-[#B8997D] px-3 py-1 rounded-full shadow-inner flex items-center">
            <i class="fa-solid fa-user-check mr-1.5 text-emerald-200"></i> 
            <span class="tracking-wide">目前操作員：<span id="operatorDisplay" class="font-bold">驗證中...</span></span>
            <input type="hidden" id="operatorName" value="">
        </div>
    </header>

    <main id="mainApp" class="p-4 max-w-lg mx-auto hidden">
        
        <div class="flex bg-gray-200 p-1 rounded-lg mb-4">
            <button id="toggle-member" onclick="setGuestMode(false)" class="flex-1 py-2 text-sm font-bold rounded bg-white text-[#B8997D] shadow-sm transition">會員調理</button>
            <button id="toggle-guest" onclick="setGuestMode(true)" class="flex-1 py-2 text-sm font-bold rounded text-gray-500 hover:text-gray-700 transition">訪客體驗</button>
        </div>

        <section class="bg-white p-4 rounded-xl shadow-sm border border-soft mb-4">
            <div id="member-search-area">
                <div class="flex justify-between items-center mb-3 border-b border-gray-100 pb-2">
                    <label class="font-bold text-earth text-sm"><i class="fa-solid fa-magnifying-glass text-[#B8997D]"></i> 會員智慧檢索與調閱</label>
                    <button type="button" id="loadBtn" onclick="fetchTodayRecord()" class="bg-[#F9F6F0] text-earth px-3 py-1.5 rounded text-xs font-bold shadow-sm active:scale-95 transition border border-[#E8DFD8]">
                        <i class="fa-solid fa-list-check"></i> 今日名單
                    </button>
                </div>
                <div class="flex gap-2 mb-2 relative">
                    <input type="text" id="clientName" list="memberList" placeholder="輸入姓名或手機 (09自動補JW)..." class="flex-1 p-2.5">
                    <datalist id="memberList"></datalist>
                    <button type="button" onclick="autoLoadOnNameChange()" class="bg-[#D2B48C] text-white px-4 rounded-lg font-bold shadow-sm hover:bg-[#B8997D] active:scale-95 transition">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
                <div id="name-profile-alert" class="hidden"></div>
                <div id="blue-profile-alert" class="hidden"></div>
                <div id="safety-alert-banner" class="hidden mt-2 p-3 bg-red-50 border border-red-200 rounded-lg text-sm shadow-sm relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-red-500"></div>
                    <div id="alert-memberId" class="text-xs text-gray-500 mb-1 font-mono"></div>
                    <div class="font-bold text-red-700 mb-1 flex items-center gap-1"><i class="fa-solid fa-heart-pulse"></i> 歷史高風險病史警示</div>
                    <div id="alert-details" class="text-xs text-red-900 leading-relaxed font-medium space-y-1"></div>
                    <div id="alert-map" class="mt-2 hidden">
                        <div class="text-[11px] font-bold text-gray-500 mb-1"><i class="fa-solid fa-images"></i> 歷史全景對比圖：</div>
                        <div class="flex gap-2">
                            <div id="bodyMapContainer" class="hidden relative w-16 h-16 border border-gray-300 rounded bg-gray-100 overflow-hidden cursor-pointer shadow-sm hover:shadow-md transition">
                                <img id="latestBodyMapImg" src="" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 hover:opacity-100 transition text-white text-[10px] font-bold">全身</div>
                            </div>
                            <div id="handFootMapContainer" class="hidden relative w-16 h-16 border border-gray-300 rounded bg-gray-100 overflow-hidden cursor-pointer shadow-sm hover:shadow-md transition">
                                <img id="latestHandFootMapImg" src="" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 hover:opacity-100 transition text-white text-[10px] font-bold">手足</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="master-profile-info" class="hidden mt-3 p-3 bg-[#FFFFFF] border border-[#F9F6F0] rounded-lg text-xs shadow-sm">
                    <div class="flex flex-wrap gap-x-4 gap-y-2 text-earth">
                        <div><span class="text-gray-400">性別:</span> <span id="master-gender" class="font-bold"></span></div>
                        <div><span class="text-gray-400">年齡:</span> <span id="master-age" class="font-bold"></span></div>
                        <div><span class="text-gray-400">生日:</span> <span id="master-birthday" class="font-bold font-mono"></span></div>
                        <div class="w-full"><span class="text-gray-400">職業:</span> <span id="master-jobCat" class="font-bold"></span> - <span id="master-job" class="font-bold"></span></div>
                    </div>
                    <div id="master-pre-consult-summary"></div>
                </div>
            </div>

            <div id="guest-input-area" class="hidden">
                <div class="font-bold text-earth text-sm mb-3 pb-2 border-b border-gray-100"><i class="fa-solid fa-user-tag text-[#B8997D]"></i> 訪客快速建檔</div>
                <div class="mb-3">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">訪客姓名 <span class="text-red-500">*</span></label>
                    <input type="text" id="guestName" placeholder="請輸入訪客稱呼..." class="w-full p-2.5">
                </div>
                <div class="mb-2">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">聯絡電話 (選填)</label>
                    <input type="tel" id="guestPhone" placeholder="09..." class="w-full p-2.5">
                </div>
            </div>
        </section>

        <div class="flex mb-4 bg-white rounded-xl shadow-sm border border-soft p-1" id="mode-tabs-container">
            <button id="tab-profile" onclick="switchMode('profile')" class="flex-1 py-2 text-sm font-bold rounded-lg text-white bg-earth transition-all">櫃檯初訪建檔</button>
            <button id="tab-record" onclick="switchMode('record')" class="flex-1 py-2 text-sm font-bold rounded-lg text-[#B8997D] bg-transparent transition-all">師傅專業調理</button>
        </div>

        <section id="section-record-view" class="hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-soft mb-4">
                <div class="font-bold text-earth text-sm mb-3 pb-2 border-b border-gray-100 flex items-center justify-between">
                    <span><i class="fa-solid fa-clipboard-user text-[#B8997D] mr-1"></i> 調理基礎資訊</span>
                    <span id="auto-save-indicator" class="text-[10px] text-gray-400 opacity-0 transition-opacity flex items-center gap-1 font-normal bg-gray-50 px-1.5 py-0.5 rounded border border-gray-200"></span>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">調理日期</label>
                        <input type="date" id="recordDate" class="w-full p-2">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">方案</label>
                        <select id="treatmentItem" class="w-full p-2 text-blue-700 font-bold"></select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">客製化加強部位 (外帳顯示用)</label>
                    <input type="text" id="customerFocusArea" placeholder="例如：肩頸加強、腰部舒緩..." class="w-full p-2">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">協助/見習助理 (選填)</label>
                    <input type="text" id="assistantName" placeholder="填寫助理姓名..." class="w-full p-2">
                </div>
            </div>

            <div class="flex justify-between items-center mb-2 px-1" id="symptoms-header">
                <div class="font-bold text-earth text-sm"><i class="fa-solid fa-bed-pulse text-[#B8997D]"></i> 調理點位追蹤紀錄</div>
                <button type="button" onclick="fetchHistory('recent')" class="text-[11px] font-bold text-white bg-[#B8997D] px-3 py-1.5 rounded-lg shadow-sm hover:bg-[#A68A6D] transition">
                    <i class="fa-solid fa-clock-rotate-left"></i> 溯源病史
                </button>
            </div>

            <div id="symptoms-container"></div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-soft mb-4">
                <div class="font-bold text-earth text-sm mb-3 pb-2 border-b border-gray-100 flex items-center gap-1">
                    <i class="fa-solid fa-file-medical text-[#B8997D]"></i> 綜合評估與全景照片
                </div>
                
                <div class="mb-3" id="recent-status-container">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">顧客本次回饋 / 近期狀態史 (會置頂堆疊)</label>
                    <textarea id="recentStatus" rows="2" placeholder="紀錄客人的主觀感受或生活改變..." class="w-full p-2.5 bg-blue-50/50"></textarea>
                </div>
                
                <div class="mb-3" id="global-photos-wrapper">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">追加全景對比照片 (選填, 最多4張)</label>
                    <div class="flex gap-2" id="global-photos-container" data-urls="[]"></div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">本次調理整體備註 (內部查閱用)</label>
                    <textarea id="globalNote" rows="4" placeholder="總結本次調理邏輯、發現的深層問題或特殊注意事項..." class="w-full p-2.5"></textarea>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-soft mb-6" id="handoff-container">
                <div class="font-bold text-earth text-sm mb-3 pb-2 border-b border-gray-100"><i class="fa-solid fa-calendar-plus text-[#B8997D] mr-1"></i> 後續追蹤與下次回診安排</div>
                
                <div class="mb-4">
                    <label class="block text-xs font-bold text-gray-700 mb-2">課程後續交接狀態 <span class="text-red-500">*</span></label>
                    <input type="hidden" id="handoffStatus" value="">
                    <div class="flex gap-2">
                        <button type="button" id="ho-draft" onclick="setHandoff('🔵進度暫存，尚未結帳')" class="flex-1 py-2.5 text-[11px] font-bold border-2 border-blue-300 text-blue-700 rounded-lg bg-white transition-all shadow-sm">🔵 暫存 (未結)</button>
                        <button type="button" id="ho-escalate" onclick="setHandoff('🟠需上級支援，尚未結帳')" class="flex-1 py-2.5 text-[11px] font-bold border-2 border-orange-300 text-orange-700 rounded-lg bg-white transition-all shadow-sm">🟠 支援 (未結)</button>
                        <button type="button" id="ho-checkout" onclick="setHandoff('🟢調理完畢，等待結帳')" class="flex-1 py-2.5 text-[11px] font-bold border-2 border-green-400 text-green-700 rounded-lg bg-white transition-all shadow-sm">🟢 完畢 (交結帳)</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">下次建議調理日期</label>
                        <input type="date" id="nextCourseDate" class="w-full p-2">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">預計時間</label>
                        <input type="time" id="nextCourseTime" class="w-full p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">指定師傅 (選填)</label>
                    <input type="text" id="nextOperator" placeholder="若客人有指定師傅請填寫..." class="w-full p-2">
                </div>
            </div>
        </section>

        <section id="section-profile-view" class="bg-white p-4 rounded-xl shadow-sm border border-soft mb-6">
            <div class="font-bold text-earth text-sm mb-3 pb-2 border-b border-gray-100 flex items-center justify-between">
                <span><i class="fa-solid fa-address-card text-[#B8997D] mr-1"></i> 櫃檯基本資料建檔</span>
                <span class="text-[10px] text-red-500 font-normal">* 為必填欄位</span>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="col-span-2">
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">手機號碼 (10碼數字) <span class="text-red-500">*</span></label>
                    <input type="tel" id="prof-phone" placeholder="0912345678" class="w-full p-2 font-mono">
                    <div class="text-[9px] text-gray-400 mt-1">系統將以此號碼建立全域唯一識別碼，並自動查核舊庫</div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">生理性別 <span class="text-red-500">*</span></label>
                    <select id="prof-gender" class="w-full p-2">
                        <option value="">-- 請選擇 --</option>
                        <option value="男性">男性</option>
                        <option value="女性">女性</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">生日 (自動推算年齡)</label>
                    <input type="date" id="prof-birthday" class="w-full p-2">
                    <input type="hidden" id="prof-age">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">了解我們的途徑 <span class="text-red-500">*</span></label>
                    <select id="prof-source" class="w-full p-2">
                        <option value="">-- 請選擇 --</option>
                        <option value="親友介紹">親友介紹</option>
                        <option value="Google 地圖">Google 地圖</option>
                        <option value="FB/IG 粉專">FB/IG 粉專</option>
                        <option value="路過">路過</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">初次來店原因 <span class="text-red-500">*</span></label>
                    <select id="prof-reason" class="w-full p-2">
                        <option value="">-- 請選擇 --</option>
                        <option value="身體緊繃痠痛">身體緊繃痠痛</option>
                        <option value="結構保養調整">結構保養調整</option>
                        <option value="睡眠品質不佳">睡眠品質不佳</option>
                        <option value="頭痛">頭痛</option>
                        <option value="手痛">手痛</option>
                        <option value="腳痛">腳痛</option>
                        <option value="坐骨神經痛">坐骨神經痛</option>
                        <option value="骨盆前傾">骨盆前傾</option>
                        <option value="脊椎側彎">脊椎側彎</option>
                        <option value="圓肩駝背">圓肩駝背</option>
                        <option value="其他...">其他...</option>
                    </select>
                </div>
            </div>
            
            <div id="prof-reason-other-container" class="mb-3">
                <input type="text" id="prof-reason-other" placeholder="請概略描述問題狀況..." class="w-full p-2">
            </div>

            <div class="mb-3">
                <label class="block text-[10px] font-bold text-gray-500 mb-1">方案 <span class="text-red-500">*</span></label>
                <select id="prof-treatmentItem" class="w-full p-2 text-blue-700 font-bold"></select>
            </div>

            <div class="bg-red-50/50 p-3 rounded-lg border border-red-100 mb-3">
                <div class="font-bold text-red-700 text-xs mb-2"><i class="fa-solid fa-notes-medical"></i> 重大病史調查 (若無請填「無」) <span class="text-red-500">*</span></div>
                <div class="space-y-2">
                    <input type="text" id="prof-surgery" placeholder="開刀史..." class="w-full p-2 border-red-200 focus:border-red-400">
                    <input type="text" id="prof-chronic" placeholder="慢性病史 (高血壓、糖尿病等)..." class="w-full p-2 border-red-200 focus:border-red-400">
                    <input type="text" id="prof-fracture" placeholder="骨折意外史..." class="w-full p-2 border-red-200 focus:border-red-400">
                    <input type="text" id="prof-special" placeholder="特殊疾病 (癌症、心血管、蟹足腫等)..." class="w-full p-2 border-red-200 focus:border-red-400">
                </div>
            </div>

            <div class="font-bold text-earth text-sm mb-3 mt-4 pb-2 border-b border-gray-100">
                <i class="fa-solid fa-clipboard-question text-[#B8997D] mr-1"></i> 櫃檯初步詢問重點
            </div>
            <div id="pre-slots-container" class="mb-3"></div>
            
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">工作類型</label>
                        <select id="prof-jobCategory" class="w-full p-2">
                            <option value="">-- 選擇 --</option>
                            <option value="久坐辦公">久坐辦公</option>
                            <option value="久站勞動">久站勞動</option>
                            <option value="體力搬重">體力搬重</option>
                            <option value="頻繁走動">頻繁走動</option>
                            <option value="家管/無業">家管/無業</option>
                            <option value="學生">學生</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-500 mb-1">現職工作名稱</label>
                        <input type="text" id="prof-currentJob" placeholder="例如：軟體工程師..." class="w-full p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">特殊生活習慣</label>
                    <input type="text" id="prof-lifestyle" placeholder="例如：慣用右手、長期熬夜、喜歡翹腳..." class="w-full p-2">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">相關檢驗資訊 (X光/MRI等報告備註)</label>
                    <input type="text" id="prof-inspection" placeholder="客人自述之醫學檢驗結果..." class="w-full p-2">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 mb-1">內部永久特殊備註</label>
                    <input type="text" id="prof-permNote" placeholder="例如：極度怕痛、禁止按壓頭部..." class="w-full p-2">
                </div>
            </div>
        </section>

        <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-3 flex gap-2 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
            <button id="submitBtn" onclick="handleSubmit()" class="flex-1 bg-[#D2B48C] text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-[#B8997D] active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up"></i> 確定同步歸檔
            </button>
            <button type="button" onclick="fetchBillingDashboard()" class="bg-[#F9F6F0] text-[#B8997D] px-4 py-3 rounded-xl font-bold text-sm border border-[#E8DFD8] hover:bg-[#F5F0E6] active:scale-[0.98] transition-all">
                <i class="fa-solid fa-cash-register"></i>
            </button>
        </div>
    </main>

    <div id="historyModal" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-end sm:items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-[#F9F6F0] w-full sm:w-11/12 max-w-md h-[85vh] sm:h-auto sm:max-h-[85vh] rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-white px-5 py-4 border-b border-gray-200 flex justify-between items-center sticky top-0 z-10 shadow-sm">
                <div>
                    <h3 id="modalTitle" class="font-bold text-lg text-earth"></h3>
                    <p id="modalSubtitle" class="text-[10px] text-gray-500 mt-0.5 font-medium"></p>
                </div>
                <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="bg-gray-100 text-gray-500 w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-200 transition">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 bg-[#FFFFFF]" id="historyContent"></div>
            <div class="bg-white p-3 border-t border-gray-200 flex gap-2">
                <button onclick="fetchHistory('recent')" class="flex-1 py-2 bg-blue-50 text-blue-700 text-xs font-bold rounded border border-blue-200 hover:bg-blue-100 transition">五筆(圖文)</button>
                <button onclick="fetchHistory('week')" class="flex-1 py-2 bg-gray-50 text-gray-600 text-xs font-bold rounded border border-gray-200 hover:bg-gray-100 transition">本週(縮略)</button>
                <button onclick="fetchHistory('month')" class="flex-1 py-2 bg-gray-50 text-gray-600 text-xs font-bold rounded border border-gray-200 hover:bg-gray-100 transition">本月(縮略)</button>
            </div>
        </div>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/50 hidden z-[70] flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white w-10/12 max-w-sm rounded-2xl p-6 text-center shadow-2xl transform transition-all scale-100">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-check text-3xl text-green-500"></i>
            </div>
            <h3 class="font-bold text-lg text-gray-800 mb-2">處理完成</h3>
            <p id="successMessage" class="text-sm text-gray-500 mb-6 leading-relaxed"></p>
            <div class="flex flex-col gap-2">
                <button onclick="document.getElementById('successModal').classList.add('hidden'); clearAllForms(); document.getElementById('clientName').value='';" class="w-full bg-[#D2B48C] text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-[#B8997D] active:scale-95 transition">
                    接待下一位顧客
                </button>
            </div>
        </div>
    </div>

    <script src="js/data_map.js"></script>
    <script src="js/main.js"></script>
    <script src="js/ui_utils.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
